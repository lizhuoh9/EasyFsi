  scheduled-cuda-step50:
    if: github.event_name == 'schedule' || inputs.run_cuda_step50 == true
    runs-on: [self-hosted, windows, x64, cuda]
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused CUDA state-contract regressions
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.solvers.test_main_audit_coupling_contracts `
            tests.solvers.test_main_audit_fluid_state_contracts `
            tests.solvers.test_main_audit_solid_input_contracts `
            tests.solvers.test_mooney_shell_post_step_oob_cuda `
            tests.solvers.test_tri_surface.TriSurfaceRegionDiagnosticsTests.test_report_only_active_force_cells_match_final_cancelled_force_field

      - name: Run staged CUDA step-50 validation
        shell: pwsh
        run: |
          python validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_selected_formulation_coupled_step50.py

      - name: Upload staged CUDA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansys-vertical-flap-cuda-step50
          path: validation_runs/ansys_vertical_flap_fsi/traction_selected_formulation_coupled_step50_diagnostics
