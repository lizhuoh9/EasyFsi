name: ANSYS vertical flap validation contracts

on:
  workflow_dispatch:
    inputs:
      run_cuda_step50:
        description: Run the long CUDA step-50 validation on a self-hosted runner
        type: boolean
        default: false
  schedule:
    - cron: "17 18 * * 1"
  push:
    branches:
      - main
      - solver/**
      - codex/**
  pull_request:
    branches:
      - main

jobs:
  quality-and-fast-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run static quality gates
        run: |
          python -m ruff check . --select F601,F821
          python -m compileall -q simulation_core cases tools

      - name: Run CPU-only R24 through R24C evidence gates
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python -m py_compile \
            benchmarks/official/solid_mpm_fsi_runner.py \
            src/refactored/validation/ansys_vertical_flap_fsi/kalman_statistical_calibration.py \
            src/refactored/validation/ansys_vertical_flap_fsi/kalman_oracle_headroom.py \
            src/refactored/validation/ansys_vertical_flap_fsi/kalman_oracle_headroom_analysis.py \
            src/refactored/validation/ansys_vertical_flap_fsi/kalman_oracle_headroom_artifacts.py \
            src/refactored/validation/ansys_vertical_flap_fsi/kalman_oracle_headroom_contracts.py \
            src/refactored/validation/ansys_vertical_flap_fsi/kalman_oracle_headroom_integrity.py \
            src/refactored/validation/ansys_vertical_flap_fsi/kalman_oracle_headroom_verification.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_common.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_probe_contracts.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_iqn_first_update.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_displacement_evidence.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_evidence.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_lineage.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_prefix_decisions.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_publication.py \
            src/refactored/validation/ansys_vertical_flap_fsi/oracle_threshold_reuse_evidence.py \
            validation_runs/ansys_vertical_flap_fsi/our_solver_fine_vs_fluent_2026-07-02/scripts/run_our_solver_vertical_flap.py \
            tools/audit_ansys_vertical_flap_kalman.py \
            tools/audit_ansys_vertical_flap_oracle_headroom.py \
            tools/audit_ansys_vertical_flap_oracle_threshold.py \
            tests/validation/test_kalman_statistical_calibration.py \
            tests/validation/test_kalman_oracle_headroom.py \
            tests/validation/test_kalman_oracle_headroom_fail_closed.py \
            tests/validation/test_oracle_threshold_iqn_first_update.py \
            tests/validation/test_oracle_threshold_lineage.py \
            tests/validation/test_oracle_threshold_publication.py \
            tests/validation/test_oracle_threshold_reuse_evidence.py \
            tests/validation/test_our_solver_vertical_flap_runner.py \
            tests/integration/test_ansys_vertical_flap_runner_loop_contract.py

          python -m pytest -q \
            tests/validation/test_kalman_statistical_calibration.py \
            tests/validation/test_kalman_oracle_headroom.py \
            tests/validation/test_kalman_oracle_headroom_fail_closed.py \
            tests/validation/test_kalman_iqn_reuse_fine_contracts.py \
            tests/validation/test_oracle_threshold_iqn_first_update.py \
            tests/validation/test_oracle_threshold_lineage.py \
            tests/validation/test_oracle_threshold_publication.py \
            tests/validation/test_oracle_threshold_reuse_evidence.py \
            tests/validation/test_our_solver_vertical_flap_runner.py \
            tests/integration/test_ansys_vertical_flap_runner_loop_contract.py::AnsysVerticalFlapRunnerLoopContractTests::test_iqn_runner_maps_generic_threshold_audit_histories \
            tests/integration/test_ansys_vertical_flap_runner_loop_contract.py::AnsysVerticalFlapRunnerLoopContractTests::test_research_probe_recaptures_and_compares_after_each_rollback \
            tests/integration/test_ansys_vertical_flap_runner_loop_contract.py::AnsysVerticalFlapRunnerLoopContractTests::test_research_probe_rejects_iqn_history_reuse \
            tests/integration/test_ansys_vertical_flap_runner_loop_contract.py::AnsysVerticalFlapRunnerLoopContractTests::test_research_probe_terminal_satisfies_official_report_contract \
            tests/tools/test_calibrate_iqn_kalman_qr.py \
            tests/coupling/test_interface_kalman_predictor.py \
            tests/coupling/test_active_kalman_writeback.py \
            tests/benchmarks/test_modified_physics_kalman_contract.py

          python tools/audit_ansys_vertical_flap_kalman.py --help
          python tools/audit_ansys_vertical_flap_oracle_headroom.py --help
          python tools/audit_ansys_vertical_flap_oracle_threshold.py --help

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base...HEAD"

      - name: Run fast platform-independent contracts
        run: |
          python -m unittest -v \
            tests.integration.test_validation_ci_workflow \
            tests.integration.test_generic_entrypoint \
            tests.integration.test_ansys_vertical_flap_step50_cli \
            tests.cases.test_squid_import_contracts \
            tests.cases.test_squid_checkpoint_atomicity \
            tests.cases.test_squid_explicit_context_contract \
            tests.cases.test_squid_sharp_contract_fixes \
            tests.benchmarks.test_main_audit_particle_bin_generation_wiring \
            tests.solvers.test_main_audit_graded_grid_performance \
            tests.solvers.test_main_audit_numeric_contracts \
            tests.solvers.test_cad_tessellation.CadTessellationTests.test_step_part_entity_tag_expands_all_part_surfaces_on_tag_collision \
            tests.solvers.test_hibm.HibmMpmSharpPathFailFastTests.test_sharp_mpm_step_requires_fresh_external_force_before_solid_advance \
            tests.solvers.test_tri_surface.TriSurfaceRegionDiagnosticsTests.test_f32_kernel_parameters_reject_f64_overflow_before_launch \
            tests.cases.test_squid_latest_core_config.SquidRunCheckpointMarkerStateTests.test_run_checkpoint_version_is_7 \
            tests.cases.test_ansys_vertical_flap_fsi.AnsysVerticalFlapFsiSmokeTests.test_full_domain_runner_passes_full_step_neumann_dt_once \
            tests.cases.test_ansys_vertical_flap_fsi.AnsysVerticalFlapFsiSmokeTests.test_full_domain_runner_uses_full_span_flaps \
            tests.cases.test_ansys_vertical_flap_fsi.AnsysVerticalFlapFsiSmokeTests.test_canonical_runner_rejects_underresolved_solid_particles_for_fine_grid \
            tests.cases.test_ansys_vertical_flap_fsi.AnsysVerticalFlapFsiSmokeTests.test_full_domain_runner_uses_local_surface_force_support_radius \
            tests.cases.test_ansys_vertical_flap_fsi.AnsysVerticalFlapFsiSmokeTests.test_full_domain_runner_persists_solid_substeps_in_process_updates \
            tests.cases.test_ansys_vertical_flap_fsi.AnsysVerticalFlapFsiSmokeTests.test_full_domain_runner_has_official_style_stationary_preflow_option \
            tests.tools.test_ansys_vertical_flap_temporal_gate \
            tests.tools.test_validation_artifact_hygiene

          python -m pytest -q \
            tests/validation/test_native_fine_comparison.py \
            tests/validation/test_native_fine_contract_hardening.py::test_postprocess_cli_default_tracks_latest_fresh50_bundle \
            tests/validation/test_native_fine_contract_hardening.py::test_postprocess_cli_returns_nonzero_when_five_percent_gate_fails \
            tests/validation/test_turek_hron_rendering.py::test_two_synthetic_snapshots_render_with_one_fixed_scale_and_make_gif

  contracts:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile ANSYS validation modules
        shell: pwsh
        run: |
          python -m py_compile `
            simulation_core\drivers\generic_fsi_solver.py `
            simulation_core\coupling\pressure_sample_pairs.py `
            cases\ansys_vertical_flap_fsi.py `
            benchmarks\official\solid_mpm_fsi_runner.py `
            tools\validation\print_ansys_vertical_flap_diagnostics.py `
            tools\validation\ansys_vertical_flap_temporal_gates.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_source_outlet_balance_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_source_candidate_step20_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_fixed_solid_source_temporal_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_fixed_solid_load_temporal_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_formulation_validation_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_probe_observability_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_shared_snapshot.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_snapshot_resampling_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_probe_offset_decoupling_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_probe_ladder_stability_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_probe_ladder_control_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_symmetric_pressure_pair_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_pressure_pair_anchor_map_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_pressure_pair_reference_preselection_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_per_face_one_sided_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_reference_formulation_selection_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_fixed_solid_selected_formulation_matrix.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_selected_formulation_coupled_smoke.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_selected_formulation_coupled_step50.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\build_synthetic_fluent_reference_fixture.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\check_fluent_artifact_policy.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\fluent_reference_contract_schema.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\fluent_source_export_schema.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\import_real_fluent_source_exports.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_official_fluent_2way_fsi50_snapshot.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_fluent_reference_collection_validation.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_traction_selected_formulation_fluent_parity.py `
            validation_runs\ansys_vertical_flap_fsi\scripts\run_preflow_release_step20_matrix.py `
            scripts\check_validation_artifact_hygiene.py

          python -m py_compile `
            tests\contracts\test_generic_fsi_solver_architecture.py `
            tests\contracts\test_architecture_boundaries.py `
            tests\benchmarks\test_official_benchmark_solver.py `
            tests\cases\test_ansys_vertical_flap_fsi.py `
            tests\integration\test_ansys_vertical_flap_branch_review_docs.py `
            tests\integration\test_ansys_vertical_flap_fluent_artifact_policy.py `
            tests\integration\test_ansys_vertical_flap_policy_reports.py `
            tests\integration\test_refactoring_docs_are_nonempty.py `
            tests\integration\test_ansys_vertical_flap_real_fluent_import_gate_doc.py `
            tests\integration\test_ansys_vertical_flap_fluent_reference_export_protocol.py `
            tests\integration\test_ansys_vertical_flap_fluent_reference_synthetic_pipeline.py `
            tests\integration\test_ansys_vertical_flap_fluent_source_export_schema.py `
            tests\integration\test_ansys_vertical_flap_real_fluent_source_export_import.py `
            tests\integration\test_ansys_vertical_flap_real_fluent_source_export_artifacts.py `
            tests\integration\test_official_fluent_2way_snapshot_reference_loading.py `
            tests\integration\test_ansys_vertical_flap_real_solver_validation_status.py `
            tests\integration\test_ansys_vertical_flap_traction_selected_formulation_fluent_parity_comparison_logic.py `
            tests\tools\test_validation_artifact_hygiene.py `
            tests\solvers\test_pressure_sample_pair_provider_contract.py

      - name: Run shared-driver and canonical ANSYS contracts
        shell: pwsh
        run: |
          python -m unittest -v `
            tests.solvers.test_pressure_sample_pair_provider_contract `
            tests.contracts.test_generic_fsi_solver_architecture `
            tests.contracts.test_architecture_boundaries `
            tests.benchmarks.test_official_benchmark_solver `
            tests.cases.test_ansys_vertical_flap_fsi.AnsysVerticalFlapFsiSmokeTests.test_public_ansys_entrypoints_reject_removed_cell_obstacle_backend `
            tests.cases.test_ansys_vertical_flap_fsi.AnsysVerticalFlapFsiSmokeTests.test_selected_config_has_one_runtime_pressure_pair_policy `
            tests.integration.test_ansys_vertical_flap_traction_selected_formulation_fluent_parity_comparison_logic

      - name: Run archive artifact test - official half-domain
        shell: pwsh
        run: |
          python -m unittest `
